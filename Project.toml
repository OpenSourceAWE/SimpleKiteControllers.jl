name = "SimpleKiteControllers"
uuid = "6b1669b4-da33-4b52-bbac-669bd9da52ef"
authors = ["Uwe Fechner <u.fechner-1@tudelft.nl> and contributors"]
version = "1.0.0-DEV"

[deps]
DiscretePIDs = "c1363496-6848-4723-8758-079b737f6baf"
KiteModels = "b94af626-7959-4878-9336-2adc27959007"
KiteUtils = "90980105-b163-44e5-ba9f-8b1c83bb0533"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Parameters = "d96e819e-fc66-5662-9728-84c9c7592b0a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"

[compat]
DiscretePIDs = "0.1.6"
# 0.11 rather than 0.8.1: 0.8.1 pins KitePodModels 0.3.8 while V3Kite needs 0.4,
# which made the workspace below unsatisfiable. The separate example environment
# hid the clash — it never had to reconcile the two.
KiteModels = "0.11"
# 0.11 rather than 0.10.13: V3Kite pulls KitePodModels 0.4, which requires
# KiteUtils 0.11, so `examples/` could not resolve at all on the old bound.
KiteUtils = "0.11"
LinearAlgebra = "1"
Parameters = "0.12.3"
Printf = "1"
StaticArrays = "1.9.18"
Statistics = "1"
YAML = "0.4.16"
# 1.10 rather than 1.6.7: KiteUtils 0.10.13 itself declares "1.10, 1.11, 1.12",
# so the old bound was never satisfiable together with it.
julia = "1.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]

# `examples/` is a sub-project of this one: it keeps its own Project.toml (the
# plotting and simulation stacks it needs are far heavier than anything this
# package does, and they must not become deps of the library), but resolves
# against ONE shared Manifest.toml here at the root rather than its own. So a
# dependency shared by both — KiteUtils, DiscretePIDs — is guaranteed to be the
# same version in a script as in the package it is exercising.
#
# Needs Pkg 1.11+. Older versions ignore this table and resolve `examples/`
# standalone against its own Manifest, which still works.
[workspace]
projects = ["examples"]
