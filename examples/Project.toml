# Shared environment for the example scripts. It is NOT the package's own
# environment: the plotting and simulation stacks (GLMakie, V3Kite and its
# solver chain) are far heavier than anything SimpleKiteControllers itself needs,
# and keeping them here leaves the package light.
#
# It IS a workspace member of the root project (`[workspace]` in ../Project.toml),
# so the two resolve together into one Manifest.toml at the repository root —
# a dependency shared by both is the same version here as in the package.
#
# The V3Kite source below is switched by two scripts, not by hand: `bin/dev`
# points it at a local checkout (default ../V3Kite), `bin/free` puts it back on
# `{url = ..., rev = "v1.0.2"}` — the committable state, so run `bin/free`
# before pushing. The code is identical either way, but a git-rev source makes
# `init()` cost ~34 s instead of ~2 s: its precompiled ODE right-hand side goes
# unused and is re-JIT'ed every process. Measurements and dead ends in
# docs/sysimage_notes.md.
#
[deps]
DiscretePIDs = "c1363496-6848-4723-8758-079b737f6baf"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
KiteUtils = "90980105-b163-44e5-ba9f-8b1c83bb0533"
LaTeXStrings = "b964fa9f-0449-5b57-a5c2-d3ea65f4040f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MakieControlPlots = "6d616b69-6563-4f6e-8472-6f6c706c6f74"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
RuntimeGeneratedFunctions = "7e49a35a-f44a-4d26-94aa-eba1b4ca6b47"
SimpleKiteControllers = "6b1669b4-da33-4b52-bbac-669bd9da52ef"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Timers = "21f18d07-b854-4dab-86f0-c15a3821819a"
V3Kite = "4caac9c8-c726-438f-ab10-3553e918eab1"

[compat]
MakieControlPlots = "0.1.12"
RuntimeGeneratedFunctions = "=0.5.22"

[sources]
SimpleKiteControllers = {path = ".."}
# V3Kite = {url = "https://github.com/OpenSourceAWE/V3Kite.jl", rev = "v1.0.2"}
V3Kite = {path = "../../V3Kite"}

[extras]
Revise = "295af30f-e4ad-537b-8983-00126c2a3abe"
