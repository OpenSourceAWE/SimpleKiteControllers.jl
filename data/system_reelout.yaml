# System project of the figure-of-eight run, named by `fc_settings.yaml`'s
# `project` key and resolved by `project_file` to THIS package's data/ rather
# than the kite model's. It exists so the simulation conditions of a run (wind,
# tether, winch, KCU, solver) can be varied here without editing V3Kite.
#
# KiteUtils resolves `sim_settings` relative to the directory of this file;
# `wc_settings` is a bare name, resolved under the ACTIVE data path, which the
# example points at this directory. All three files are therefore the copies next to
# this one. The geometry, polars and VSM settings never pass through here —
# V3Kite loads them from v3_data_path() directly.
system:
    sim_settings: "settings_reelout.yaml"
    wc_settings: "wc_settings.yaml"
    fc_settings: "fc_setting.yaml"
