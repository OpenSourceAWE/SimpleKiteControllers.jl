# Settings of the figure-of-eight flight controller flown by
# examples/simple_fig8.jl. Loaded into an `FC_Settings` struct via
# `FC_Settings("fc_settings.yaml")`; each section below is a part of that struct
# (src/fc_settings.jl) and each key a field of that part. The docstrings there
# stay on one line; the comments below carry the longer notes.
# A missing key falls back to the struct default, an unknown key is an error.
#
# The PLANT is not here either: the system project (system_fig8_200m.yaml next to
# this file) and the simulation settings it names — including sim_time, the
# sample_freq whose inverse is the timestep, the wind speed (v_wind) and the
# initial tether length (l_tethers) — describe what is being flown, not how it is
# controlled.
#
# The winch gains are NOT here, neither the POSITION-mode nor the FORCE-mode ones —
# they live in wc_settings.yaml next to this file and are read straight from there.
# Only `compliance` is here, because how compliant the winch is during a
# figure-eight is a choice of the run, not a property of the model: it divides the
# force-mode gains (see `winch_force_gains`), and the controller they feed is
# WinchControllers.jl's WinchForceController. The dated record of how these values were arrived at is in
# docs/fig8_tuning_log.md.
fc_settings:
  course:  # heading/course loop: entry state machine, depower, PID, feedback, descent limiter
    park_time:          2.0      # Park: zero steering while the transients decay     [s]
    chi_dive:           -145.0   # Dive course; >90 descends, <90 climbs, 90 flat    [deg]
    chi_hold:           -90.0    # Course commanded during the hold                 [deg]
    dive_el_margin:     15.0     # Margin above el_center where the dive ends       [deg]
    hold_time:          0.8      # Duration of the hold                               [s]
    fig8_d_gate:        5.0      # Cross-track error, transition -> fig8            [deg]
    entry_gain:         0.25     # Factor on heading_p during the entry phases        [-]
    entry_depower:      0.37     # Depower during the entry phases                    [-]
    depower_setpoint:   0.27     # Depower held on the pattern                        [-]
    heading_p:          0.35     # Gain at v_app_ref                                  [-]
    heading_i:          false    # Integral time [s], or false for no integral action
    heading_d:          0.30     # Derivative time [s]
    heading_d_n:        2.0      # Derivative filter, max gain of the D path          [-]
    v_app_ref:          27.0     # Speed flown in phase 3; anchors the gain schedule [m/s]
    v_app_min:          8.0      # Lower clamp on v_app, limits the gain boost      [m/s]
    v_app_min_pattern:  23.0     # Same, from phase 3 on; the dead time grows at low v_app [m/s]
    v_kite_heading:     5.0      # At/below: pure heading feedback                  [m/s]
    v_kite_course:      10.0     # At/above: pure course feedback                   [m/s]
    fig8_pure_course:   false    # Course alone from phase 3 on; schedule governs entry
    max_steering:       0.32     # Command limit; raising it is CLOSED, see the log    [-]
    entry_chi_max:      95.0     # Steepest course while off-path; 180 disables it   [deg]
    entry_d_gate:       12.0     # Cross-track error below which it is bypassed     [deg]
    entry_d_blend:      4.0      # Blend band above the gate, 0 = hard switch       [deg]
    entry_cut_margin:   30.0     # Distance from ±180° where chi_set's sign is noise [deg]

  feedforward:  # steering feed-forward from the path's curvature, phase 4 on
    ff_gain:            1.0      # Curvature feed-forward, u_ff = psi_dot_path/(c1 v_app); 0 = off, 1 = the law's value [-]
    ff_lead_time:       0.3     # Read the path's course rate this far ahead of Q; ~the dead time [s]
    ff_smooth:          6.0      # Arc the tangent change is averaged over               [deg]
    ff_tau:             0.2      # Low-pass on u_ff and the chord correction; 0 = none    [s]
    ff_d_fade:          6.0      # Cross-track error at which the ff is fully off; fades from half [deg]
    ff_err_fade:        60.0     # Course error at which the ff is fully off; fades from half  [deg]

  pattern:  # pattern geometry and attractor; a SMALLER lemniscate is a TIGHTER one
    f8_a:               30.0     # Width of the eight, azimuth spans ±A             [deg]
    f8_b:               12.0     # Height of the eight, elevation spans ±B/2        [deg]
    el_center:          26.0     # Centre elevation; lower turns easier, costs energy [deg]
    attractor_dist:      5.5     # Arc distance Q -> attractor                      [deg]
    up_loops:           false    # Up-loops instead of down-loops; down crosses the centre

  wind_ramp:  # wind schedule of depower_setpoint, f8_a and f8_b
              # set once at the start of simple_fig8.jl; reel-out runs do not use it
    wind_ramp_low:      7.0      # Wind up to which depower_setpoint, f8_a, f8_b are flown [m/s]
    wind_ramp_high:     10.0     # Wind from which the *_high values are flown; linear between [m/s]
    depower_high:       0.33     # Held from wind_ramp_high on; keeps v_app < v_app_abort [-]
    f8_b_high:          16.0     # f8_b from wind_ramp_high on: margin 1.41 at depower 0.33 [deg]

  winch:  # compliance of the force-mode winch (its gains are in wc_settings.yaml) and force guards
    compliance:         0.5      # Winch softness; exactly 0 is POSITION mode          [-]

  run:  # simulation conditions and pass criteria
    vsm_interval:       5        # Steps between VSM aero updates, 1 = tightest; 5 as in the reel-out projects, so every project flies the same aero coupling [-]
    elevation:          73.0     # Where init settles the kite; in the settled-state cache key [deg]
    warmup_time:        2.0      # Discarded warm-up run, right after `init`          [s]
    body_damping:       [0.0, 0.0, 40.0]  # Per axis; settling starts here and decays to
                                          # 0.8x it, so this is the turn_rate_coeffs key
    v_app_abort:        45.0     # Stop the run above this apparent wind speed      [m/s]
    entry_time:         62.0     # Settle time after park_time before the metrics     [s]
    min_elevation:      10.0     # Floor criterion over the WHOLE run               [deg]
    min_span_frac:      0.7      # Pattern-SIZE criterion, fraction of f8_a / f8_b    [-]
