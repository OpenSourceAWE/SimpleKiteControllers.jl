# Turn-rate law of the V3 kite identified in crosswind flights at low elevation
# (examples/build_turn_rate_table.jl; these rows by plot_turn_rate_vs_depower.jl,
# 2026-09-29, the data in data/turn_rate_low_flights.tar.gz). The only table: the
# relay sweeps at 73° it replaced were deleted on 2026-10-01. A run of
# build_turn_rate_table rewrites this file with YAML.write_file, without these comments.
#
# Per depower, the runs of 200 s at the fixed amplitudes u_s = 0.075, 0.10, 0.125
# that stayed airborne are fitted jointly: c1 [1/m], c2 [-], dead_time and kite_lag
# [s]. `delay` [s] is dead_time + kite_lag. `v_app` [m/s] is the mean apparent wind
# speed of the fit windows (they span ~12 - 55 m/s). The *_se columns are standard
# errors from the scatter of fits on 20 s blocks (provenance, not read by the
# parser). Depower 0.40 is missing: no run stayed airborne there, so the table ends
# at 0.375 and simple_opt_reelout.jl holds c1 at that value above it.
conditions:
  system: "system_reelout_maasvlakte.yaml"
  l_tether: 150.0
  v_wind: 9.51
  elevation: 30.0
  dt: 0.0166666667
