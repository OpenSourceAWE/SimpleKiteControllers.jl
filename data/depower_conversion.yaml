# Conversion of an AWETrim power-tape length l_dp [m] (input_depower, l_dp = 0.6 + 5*u_p) into
# the V3Kite rel_depower expected to fly at the SAME tension, see awetrim_depower_to_v3kite:
#
#   rel_depower = (pivot - 0.6)/5 + offset + slope*x + curvature*x^2,   x = l_dp - pivot
#
# Near the force limit ln(force) falls by about 10 per unit of rel_depower (d ln F / d rel_depower
# -7 to -11 in the 2026-10-05 replays), so a few thousandths decide the force.
depower_conversion:
  # Total offset [rel_depower] between the two models at equal tension, at the pivot. Since
  # 2026-10-05 fitted together with slope and curvature (fit_offset = true), for the kite with
  # wing drag (wing_drag_coeff = 0.03): the drag pitches the wing up, so the kite pulls more force
  # per dynamic pressure and needs more depower at the same tape length.
  # History: 0.12 measured 2026-08-18 (docs/steering_depower.md: 0.08 the two tape-length zeros,
  # 0.04 genuine aero disagreement), 0.107 (ee1ecbd, not re-measured), 0.099 after the 8 mm tether,
  # 0.1010 (2026-08-29, power ratio 1.00 at 6 m/s after kite.mass rose to 10.9926 kg), then this
  # value. The offset is the FULL correction: do not also subtract the 0.4 m calibration offset.
  # RE-MEASURE after any change to either model's depower axis, aero, drag, or mass.
  offset: 0.1076
  # Tape length [m] the offset was calibrated at: the l_dp the optimizer flies at 6 m/s
  # (1.430 at 220 m, Cabauw 2026-10-03). Slope and curvature turn the conversion about it.
  pivot: 1.43
  # Offset, slope and curvature: identified 2026-10-05 by examples/identify_depower_conversion.jl
  # (record SimulationResults/depower_conversion/2026-10-05) for wing_drag_coeff = 0.03. Base runs
  # of Cabauw 4-10 and Maasvlakte 8, 10, 11 m/s flown twice: with a conversion interpolated between
  # the no-drag fit and one for 0.07, then with the fit from those runs (per path a depower
  # correction ln(F_meas/F_pred)/10); the second round flew power ratios 0.94-1.03. Its 30 phase-4
  # paths were replayed at depower shifts -0.01/0/+0.01; per path the shift at which the kite flies
  # the predicted mean tension (d ln F / d rel_depower -7 to -11). Weighted RMS residual 0.0034.
  # What the quadratic cannot take: within each run the later, longer-tether paths need
  # 0.004-0.010 less depower per path at the same l_dp, and Maasvlakte 10-11 m/s about 0.004 less
  # than Cabauw at equal l_dp (residual +0.003 to +0.006).
  # History: 2026-10-03, without wing drag and offset kept at 0.1010: slope 0.1147, curvature
  # 0.1905 (35 paths, RMS 0.0042); before that 0.2 (tape geometry) and 0.1833.
  # rel_depower per metre of tape at the pivot [1/m].
  slope: 0.1392
  # rel_depower per metre squared [1/m^2]; 0 is the straight line.
  curvature: 0.2427
  # Tape lengths [m] the slope and curvature were identified on; outside them the conversion
  # continues along the tangent at the nearer end.
  l_dp_min: 1.4000
  l_dp_max: 1.9100
