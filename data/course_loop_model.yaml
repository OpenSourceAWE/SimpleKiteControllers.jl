# Identified parameters of the linear course-loop model (src/course_loop_model.jl), used by
# the stability analysis (examples/stability_fig8.jl, stability_opt_reelout.jl, ...). Each key
# is a field of `CourseLoopModel`; every key must be present, an unknown key is an error.
# The turn-rate law itself (c1, c2, dead time, kite lag over depower) is in
# turn_rate_coeffs.yaml, not here. The steering tape's lag is not identified: it is
# 1/steering_gain of the KCU's P controller, from the project's settings file.
course_loop_model:
  # The kite's dead time and lag over v_a, x ∝ v_a^-exp: joint fits of the low-elevation
  # relay flights of build_turn_rate_table.jl at depower 0.275, v_wind 6.5, 8.0, 9.51 m/s
  # (v_a 25.9, 32.5, 39.1 m/s): dead time 0.094, 0.072, 0.050 s, lag 0.089, 0.078, 0.078 s.
  # Standard errors of the exponents ±0.218 and ±0.152. identify_kite_delay_scaling.jl,
  # system_reelout_maasvlakte.yaml, 2026-10-02.
  kite_dead_time_exp:  1.459  # [-]
  kite_lag_exp:        0.371  # [-]

  # Pattern law: the kite's response time in pattern flight, dead time + lag =
  # pattern_delay_ref * (pattern_v_ref / v_a)^pattern_delay_exp. Identified
  # (identify_turn_rate_law, phase 4 from 15.0 s after its start) on 6 logs at depower 0.27,
  # v_a 11.8 - 35.2 m/s, projects system_fig8_150m, system_fig8_200m, system_fig8_300m,
  # system_reelout_maasvlakte; standard error of the exponent ±0.053, log-RMS of the fit
  # 0.041. identify_pattern_law.jl, 2026-10-02.
  pattern_delay_ref:   0.144  # [s]
  pattern_v_ref:       34.0   # [m/s]
  pattern_delay_exp:   0.641  # [-]
  # The lowest v_a the law was identified at; below it the law holds its value.
  pattern_v_floor:     11.8   # [m/s]
  pattern_law_depower: 0.27   # depower the pattern law was measured at [-]
  # Growth with depower, exp(pattern_depower_exp * (depower - pattern_law_depower)): point D
  # (system_fig8_300m, 7.0 m/s) flown at depower 0.270 / 0.300 / 0.330 / 0.360 gave x0.94 /
  # 1.11 / 1.37 / 1.81 over the pattern law at the same v_a (identify_turn_rate_law, phase 4
  # from 15.0 s after its start); standard error of the exponent ±0.62.
  # identify_depower_factor.jl, 2026-10-02.
  pattern_depower_exp: 5.98   # [-]

  # Zero and pole of kite_correction, the causal stand-in for the measured kite correction
  # (kite_correction_measured.csv) in the transfer-function models: chosen as the best fit
  # among the lag-leads conservative against it at point D (system_fig8_300m, v_a 33.3 m/s):
  # gain not lower than measured below 0.8 Hz, phase not less lagging from 0.8 to 1.4 Hz;
  # log-RMS against the table 0.293. identify_kite_correction.jl, 2026-10-02.
  kite_corr_zero:      1.37   # [Hz]
  kite_corr_pole:      0.99   # [Hz]
