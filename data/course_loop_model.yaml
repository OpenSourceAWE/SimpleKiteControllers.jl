# Identified parameters of the linear course-loop model (src/course_loop_model.jl), used by
# the stability analysis (examples/stability_fig8.jl, stability_opt_reelout.jl, ...). Each key
# is a field of `CourseLoopModel`; every key must be present, an unknown key is an error.
# The turn-rate law itself (c1, c2, dead time, kite lag over depower) is in
# turn_rate_coeffs.yaml, not here. The steering tape's lag is not identified: it is
# 1/steering_gain of the KCU's P controller, from the project's settings file.
course_loop_model:
  # The kite's dead time and lag over v_a, x ∝ v_a^-exp: joint fits of the low-elevation
  # relay flights of build_turn_rate_table.jl at depower 0.275, v_wind 6.5, 9.51 m/s (v_a
  # 25.1, 38.0 m/s): dead time 0.083, 0.050 s, lag 0.067, 0.056 s. Standard errors of the
  # exponents ±0.312 and ±0.333. identify_kite_delay_scaling.jl,
  # system_reelout_maasvlakte.yaml, 2026-10-05.
  kite_dead_time_exp:  1.225  # [-]
  kite_lag_exp:        0.437  # [-]

  # Pattern delay approximation: the kite's response time in pattern flight,
  # dead time + lag = pattern_delay_ref * (pattern_v_ref / v_a)^pattern_delay_exp. Identified
  # (identify_turn_rate_law, phase 4 from 15.0 s after its start) on 6 logs at depower 0.27,
  # v_a 10.8 - 32.8 m/s, projects system_fig8_150m, system_fig8_200m, system_fig8_300m,
  # system_reelout_maasvlakte; standard error of the exponent ±0.056, log-RMS of the fit
  # 0.045. identify_pattern_delay.jl, 2026-10-05.
  pattern_delay_ref:   0.108  # [s]
  pattern_v_ref:       34.0   # [m/s]
  pattern_delay_exp:   0.932  # [-]
  # The lowest v_a the approximation was identified at; below it, it holds its value.
  pattern_v_floor:     10.8   # [m/s]
  pattern_delay_depower: 0.27 # depower the pattern delay approximation was measured at [-]
  # Growth with depower, exp(pattern_depower_exp * (depower - pattern_delay_depower)): point D
  # (system_fig8_300m, 7.0 m/s) flown at depower 0.270 / 0.300 / 0.330 / 0.360 gave x0.96 /
  # 1.06 / 1.18 / 1.64 over the pattern delay approximation at the same v_a
  # (identify_turn_rate_law, phase 4 from 15.0 s after its start); standard error of the
  # exponent ±0.86.
  # identify_depower_factor.jl, 2026-10-05.
  pattern_depower_exp: 4.47   # [-]

  # Zero and pole of kite_correction, the causal stand-in for the measured kite correction
  # (kite_correction_measured.csv) in the transfer-function models: chosen as the best fit
  # among the lag-leads conservative against it at point D (system_fig8_300m, v_a 32.0 m/s):
  # gain not lower than measured below 0.8 Hz, phase not less lagging from 0.8 to 1.4 Hz;
  # log-RMS against the table 0.266. identify_kite_correction.jl, 2026-10-05.
  kite_corr_zero:      1.32   # [Hz]
  kite_corr_pole:      0.98   # [Hz]
  kite_corr_v_ref:     32.0   # v_a of the measurement; zero and pole scale with v_a [m/s]

# The kite each step identified its values on: `kite_id` (src/kite_fingerprint.jl) of the
# projects it flew, written by the step's script. check_model_provenance compares them with
# the kite a project flies and refuses to rate or retune on a model of another kite. Step 1's
# is in each row of the turn-rate table. Backfilled 2026-10-06 from the git history: steps
# 2 - 5 were flown in commit 8217ddc, after the last change of the kite (36b665b).
provenance:
  kite_delay_scaling: "54a9ec8ae951"  # step 2, identify_kite_delay_scaling.jl
  pattern_delay:      "54a9ec8ae951"  # step 3, identify_pattern_delay.jl
  depower_factor:     "54a9ec8ae951"  # step 4, identify_depower_factor.jl
  kite_correction:    "54a9ec8ae951"  # step 5, identify_kite_correction.jl
