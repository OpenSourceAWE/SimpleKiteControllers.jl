# WinchControllers.jl's OWN settings (its `WCSettings` struct), used by
# examples/simple_reelout.jl for the REEL_OUT winch — NOT to be confused with
# this package's data/wc_settings.yaml, which is V3Kite's *own* `WC_Settings`
# (winch_pos_kp, winch_speed_k, ...) for the POSITION-mode torque loop
# underneath it. The two schemas share no key names; simple_reelout.jl loads
# each into its own object.
#
# Seeded from WinchControllers.jl's plain struct defaults, so that starting to
# load this file changes nothing that was already running: only `mode`, `kv`,
# `f_low`, `f_high` and `v_sat` differ from the package default, matching the
# values simple_reelout.jl set by hand before this file existed. `dt` is
# loaded and then immediately overwritten with the plant's own timestep — it
# is not a tuning choice, keep the placeholder.
#
# Every LowerForceController/UpperForceController gain below (pf_low, if_low,
# df_low, nf_low, kbf_low, ktf_low, fac, and their _high counterparts) was
# INVISIBLE before this file existed — simple_reelout.jl only ever set kv,
# f_low, f_high, v_sat and t_startup by hand, so the force limiters have been
# running on WinchControllers.jl's generic package defaults the whole time,
# untuned for this plant. Retune from here if the force floor needs to react
# differently than it currently does.
wc_settings:
    dt:            0.02      # overwritten with the plant's dt at load time    [s]
    test:          false     # unused; mode below already selects the REEL_OUT law
    mode:          "reelout" # "reelout" = kv*sqrt(force); "piecewise" reels in below f_low
    fac:           0.25      # factor for I and P of the lower force controller  [-]
    max_iter:      100       # max iterations of the PID solvers                [-]
    iter:          0         # actual iterations used; read-only, diagnostic
    t_startup:     0.25      # lower/upper force limiters held in reset this long;
                              # does NOT ramp v_set, see reelout_softstart's docstring [s]
    t_blend:       0.25      # blending time of the 3-channel mixer               [s]
    v_sat_error:   1.0       # input saturation of the speed controller        [m/s]
    v_sat:         8.0       # reel-out speed limit; also step!'s speed_limit  [m/s]
    v_ri_max:      8.0       # maximal reel-in speed                           [m/s]
    p_speed:       0.125     # P value of the speed controller                    [-]
    i_speed:       4.0       # I value of the speed controller                    [-]
    kb_speed:      4.0       # anti-windup back-calculation, speed controller     [-]
    kt_speed:      5.0       # tracking constant, speed controller                [-]
    vf_max:        2.75      # reel-out speed where "piecewise" mode's force saturates [m/s]
    pf_low:        0.000144  # P constant of the lower force controller           [-]
    if_low:        0.01125   # I constant of the lower force controller           [-]
    df_low:        0.000034  # D constant of the lower force controller           [-]
    nf_low:        7.0       # derivative filter N of the lower force controller  [-]
    kbf_low:       1.0       # anti-windup back-calculation, lower force ctrl     [-]
    ktf_low:       8.0       # tracking constant, lower force controller          [-]
    f_low:         350.0     # below: LowerForceController reels in, not the law  [N]
    f_reelin:      700.0     # set force during a plain reel-in phase (unused here) [N]
    f_high:        7600.0    # upper limit; keep below the plant's max_force      [N]
    pf_high:       0.00023040 # P constant of the upper force controller          [-]
    if_high:       0.012     # I constant of the upper force controller           [-]
    df_high:       0.000034  # D constant of the upper force controller           [-]
    nf_high:       15.0      # derivative filter N of the upper force controller  [-]
    kbf_high:      1.0       # anti-windup back-calculation, upper force ctrl     [-]
    ktf_high:      10.0      # tracking constant, upper force controller          [-]
    winch_iter:    10        # iterations of WinchControllers' own winch model (unused here) [-]
    max_acc:       8.0       # acceleration limit, step!'s acceleration_limit  [m/s^2]
    damage_factor: 0.2       # winch damage weighting (unused here)               [-]
    jerk_factor:   0.9       # jerk weighting in the damage calculation (unused here) [-]
    kv:            0.0408    # v_set = kv * sqrt(force)                           [-]
