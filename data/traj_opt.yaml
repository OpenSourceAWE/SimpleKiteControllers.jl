# Settings of a run flown along an EXTERNALLY optimized path
# (examples/simple_opt_fig8.jl): where the AWETrim optimizer is, the initial
# guess the solve starts from, the solver knobs the API exposes, and what is done
# with the path that comes back. Read into SimpleKiteControllers'
# `TrajOptSettings`; every key below is a field of that struct and an unknown key
# is an error.
#
# The CONDITIONS are deliberately not here. The wind comes from the system
# project's settings file (v_wind, upwind_dir, profile_law, alpha, z0 at h_ref =
# 6 m) and the winch law from its wc_settings (kv, f_low, f_high) — the same
# files the plant is built from, so the path cannot be optimized for a wind the
# kite does not fly in.
#
# The GUESS is not a formality, and that is why it lives here instead of reusing
# fc_settings.yaml's f8_a/f8_b/el_center: those size the lemniscate the other
# runs actually fly, while here it only seeds the solve. Measured 2026-08-18 at
# 150 m and 6 m/s: the reel-out pattern (20°/11° at 18°) does not converge, while
# 30°/12° and 20°/11°-at-26° both do, and reach the same 6080 W optimum; the
# server's own parametric guess converges to a different one worth 1431 W. The
# problem is multi-modal, so changing these numbers changes the answer, not just
# the run time. The STARTUP solve never retries with a different guess on its own;
# a re-optimization may, once, see reopt_retry_el_offset.
#
# guess_el_center is 22, not the 26 that was measured at 150 m, because 26 leaves
# ISOLATED FAILURE POCKETS in tether length. Measured 2026-08-18 at 6 m/s: 26
# converges at 150.0, 179.0, 180.0 and 185.0 m but throws IPOPT's iteration limit
# at 180.00027 and 181.0 - the solve climbs to 122-143 m of height, where tension
# collapses to ~1 kN and the winch law cannot be met. 22 converges at all six and
# returns the SAME optimum wherever 26 also worked (6080 W at 150 m, 6527 vs 6528
# at 179 m, 6583 vs 6584 at 185 m), so it is a strictly wider basin, not a
# different answer. Six lengths is not a proof of robustness; if a new length
# throws 422, this is the first number to move.
traj_opt:
    base_url: "http://127.0.0.1:8000"  # address of the AWETrim server
    autostart_server: true   # start one with bin/run_server when none answers
    name: "simple_opt_fig8"  # name the optimization is registered under

    # --- Initial guess ---------------------------------------------------- #
    guess_a:          30.0   # width of the guess; azimuth spans ±guess_a    [deg]
    guess_b:          12.0   # height of the guess, peak to peak             [deg]
    guess_c:           0.0   # size of the right part                        [deg]
    guess_d:           0.0   # asymmetry factor                                [-]
    guess_el_center:  22.0   # centre elevation of the guess                 [deg]
    guess_points:      361   # points sent; the reply has as many              [-]

    # --- Solver knobs ----------------------------------------------------- #
    # input_depower is the optimizer's u_p = l_dp, an absolute power-tape length in
    # METRES (server bounds 1.1-2.3), NOT the run's depower_setpoint. It is only a
    # SEED: the server optimizes it by default, and the solve that produced the
    # 6080 W above landed on 1.457 m.
    #
    # Its scale is not V3Kite's. Both are 5 m of tape per unit of rel_depower, but
    # AWETrim measures l_dp off a 1.5 m structural baseline and V3Kite off a 0.2 m
    # tape segment, so l_dp = 0.6 + 5*u_p here against 0.2 + 5*u_p there - a
    # constant 0.4 m, i.e. 8 kcu-%. The run's depower_setpoint of 0.27 is 1.95 m on
    # this scale, not the 1.55 m V3Kite's own base would give.
    #
    # Do NOT pin it to the flown depower: measured 2026-08-18, the ROM's predicted
    # power collapses as the tape is let out (4486 W pinned at 1.6, 1873 W at 1.8)
    # and 2.0 m is infeasible outright. A matching sweep on the plant settled what
    # that means: the two models respond to depower almost identically (dlnP/du_p
    # -15.2 on V3Kite against -17.8 here) but are OFFSET by 0.12 of rel_depower,
    # i.e. 0.61 m of tape - the 0.4 m above is two thirds of it. So a
    # predicted-vs-measured ratio compares two models at two points on the same
    # curve, and docs/steering_depower.md has both sweeps. That 0.61 m is an UPPER
    # bound: it was measured before the tether mismatch below was found.
    #
    # The optimizer's built-in tether is 10 mm / 970 kg/m3 against this repo's 4 mm /
    # 724. Correcting it raises the prediction 22-25 % (6080 -> 7456 W at 150 m,
    # 6537 -> 8191 W at 180 m), which is the single largest term in the
    # predicted-vs-measured gap - it turns 1.45x into 1.18x. There is no key here to
    # fix it: /init's system_config_path is a path on the SERVER. See
    # docs/fig8_tuning_log.md.
    input_depower:     1.6   # depower the solve starts from                   [m]
    reg_weight:        1.0   # regularization weight                           [-]
    detect_simple_bounds: true   # IPOPT flag

    # --- What is flown ---------------------------------------------------- #
    # An UPPER bound: a coarser reply keeps its own resolution, since upsampling a
    # polyline makes the curvature check read far tighter than the curve is.
    resample_points:   361   # points the path is resampled to                 [-]
    # Curvature margin the returned path must have at the length it is flown at
    # (path radius / the kite's minimum turn radius); 0.0 flies whatever came
    # back. Below 1.0 the path is tighter than the kite can turn at all.
    #
    # For ONE path flown throughout, the shortest tether is the worst case: the
    # kite's minimum ANGULAR turn radius is 1/(L*c1*u_s), so a fixed curve only
    # gets easier — the 150 m path measured 0.93 at its anchor and 2.18 at 350 m.
    #
    # Under reopt_enabled that does not hold, and EVERY solve is the worst case.
    # The kite's minimum PHYSICAL turn radius is 1/(c1*u_s), independent of length
    # (11.35 m at c1 = 0.2752, u_s = 0.32), and the optimizer returns patterns of
    # 11.0-11.5 m physical radius at every length — its own input_steering (±0.35)
    # and input_steering_rate (±0.29) bounds are binding in every solve. So the
    # margin sits at ~1.0 whatever the tether length, and 0.85 vs 1.01 is which
    # optimum the seed reached. Measured 2026-08-18 at 182, 200 and 246 m.
    #
    # Below 1.0 for exactly that reason: at 1.0 almost nothing installs, since the
    # replies cluster on ~1.0 with seed-dependent scatter. Every 0.1 taken off is
    # bought with real turn authority, so it is a rejection-rate knob, not a safety
    # one. Raising it back only helps once the optimizer is told about the V3's
    # turn-rate law — its own steering bound is what sets the 11 m radius.
    min_feasibility_margin: 0.74
    # Ground clearance the returned path must have AT THE ANCHOR RADIUS, i.e. before
    # any reel-out; 0.0 disables.
    #
    # 40, not AWETrim's own 50 (DEFAULT_LIMITS["height"]), and the gap is structural
    # rather than a safety margin being traded away. The optimizer constrains HEIGHT
    # and not elevation, and it reaches its 50 m floor at the END of a lap's
    # reel-out: measured 2026-08-18, an r0 = 150 m path touches 50.00 m at r = 180 m
    # and an r0 = 180 m path touches it at r = 215 m. Installed as (azimuth,
    # elevation) and flown at the anchor, both are ~42 m up — 50 * r0/r_low, with
    # r_low - r0 the ~35 m one lap reels out whatever the anchor is. So no starting
    # length clears 50 here; the run climbs through it within the first lap instead,
    # and the flown minimum is what matters (43.0 m on the 150 m run). That number is
    # in every summary as traj_opt.clearance.flown_min_m — watch it, not this.
    #
    # The real fix is to stop discarding the optimizer's radial profile (stage 4).
    min_height: 40.0

    # --- Re-optimization while the tether grows (simple_opt_reelout.jl) ----- #
    # The path is anchored to ONE radius and the run walks away from it; each
    # re-optimization re-anchors it to the length actually being flown. Requests go
    # out on a lap boundary, non-blocking (POST /step with wait=false, then poll
    # /status), so the simulation never stalls in a 7-13 s solve. A new path is
    # checked for curvature and clearance at the CURRENT length before it is
    # installed, and blended in over path_blend_time; one that fails is dropped and
    # the run keeps flying the path it has.
    reopt_enabled: true   # off by default: a run is reproducible without a server
    reopt_every_n_laps: 1    # laps between requests; never two solves at once   [-]
    max_reopt: 6             # bound on re-optimizations per run                 [-]
    path_blend_time: 4.0     # seconds over which the new path replaces the old  [s]
    reopt_poll_interval: 0.5 # seconds between /status polls; simulated when
                             # reopt_blocking is false, wall-clock when true    [s]
    # Halt the loop while a solve runs, instead of flying on through it. A solve is
    # 7-13 s, over which the tether grows by that times the reel-out speed, so a
    # non-blocking reply is anchored to a radius the run has already left. Blocking
    # removes that lag and costs the wall time: the frozen seconds are reported as
    # traj_opt.reopt.blocked_s and are taken out of performance.realtime_factor.
    reopt_blocking: true     # freeze the simulation until the reply lands       [-]
    # Elevation offset added to guess_el_center for ONE retry when a re-optimization
    # comes back "failed"; 0.0 never retries. The optimizer has isolated failure
    # pockets in tether length — measured 2026-08-18 at 6 m/s, 240 and 243 m fail
    # from the shipped guess while 246 m solves to 8931 W — and a different seed
    # usually lands outside the bad basin. The STARTUP solve still never retries:
    # there a guess that merely converges is a different optimum flown silently,
    # while a re-optimization is a candidate that must pass the curvature, clearance
    # and elevation gates first, and a failure only means flying on. Blocking mode
    # only; without the hold there is nothing to retry within.
    reopt_retry_el_offset: 2.0 # guess_el_center offset for one retry           [deg]

    # Extra elevation a path must clear above fc_settings*.yaml's min_elevation
    # before it is flown; 0.0 gates on min_elevation alone.
    #
    # The gate reads the REFERENCE path's lowest point while the criterion scores
    # the FLOWN one, and the kite flies below its reference near the lobe tips,
    # where the steering is already on the clamp. Measured twice on 2026-08-18:
    # reference 10.0° -> flown 7.0°, and reference 10.0° -> flown 7.3°. 3.0 covers
    # both. 
    candidate_elevation_margin: 3.0
