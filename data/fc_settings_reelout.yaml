# Flight-controller settings flown by examples/simple_reelout.jl and
# simple_opt_reelout.jl, named by the system_reelout_*.yaml projects next to it.
# A copy of fc_settings.yaml (simple_fig8.jl) with `compliance: 0`: REEL_OUT and
# V3Kite's FORCE mode both drive the winch, and simple_reelout.jl errors rather
# than picking one. Every key is a field of `FC_Settings` (src/fc_settings.jl),
# where each value is explained; a missing key falls back to the struct default,
# an unknown key is an error. The plant (sim_time, sample_freq, v_wind,
# l_tethers) is in the system project's settings file, the winch gains in
# wc_settings.yaml. Tuning history: docs/fig8_tuning_log.md.
fc_settings:
  # --- simulation conditions ------------------------------------------------
  vsm_interval:       10       # Steps between VSM aero updates, 1 = tightest        [-]
  compliance:         0.0      # Fixed at POSITION mode; REEL_OUT needs the drum free [-]
  depower_setpoint:   0.274    # Depower on the pattern; 0.278 is the curvature ceiling at 150 m [-]
  elevation:          73.0     # Settling elevation; no effect, see the cache key  [deg]
  park_time:          2.0      # Park: zero steering while the transients decay     [s]
  warmup_time:        2.0      # Discarded warm-up run, right after `init`          [s]

  # --- force-mode winch; unused here (compliance = 0), kept for a complete struct
  winch_force_tau:    10.0     # Compliance timescale; NOT scaled by compliance      [s]
  winch_len_kp:       100.0    # Length trim, length error -> reference force     [N/m]
  winch_damp:         500.0    # Drum damping; not optional, the drum free-wheels [N·s/m]
  winch_force_min:    100.0    # Floor on the reference force, keeps the tether taut [N]

  # --- REEL_OUT winch (this package's script logic; kv/f_low/f_high/v_sat are
  # --- WinchControllers.jl's own and live in wc_settings.yaml) ---------------
  reelout_l_max:      380.0    # Length at which reel-out stops; AWETrim's reopt ceiling is ~325 m [m]
  n_fig_eight:        0        # Laps after which reel-out stops; 0 = length only [-]
  depower_final:      0.35     # Flown from phase 5; tuned to hold ~3458 N at 6 m/s [-]
  depower_final_max:  0.42     # Ceiling of the phase-5 force limiter; = depower_final is OFF [-]
  depower_final_f_target: 7500.0 # Force the limiter holds, under 8400 N by the lobe swing [N]
  depower_final_f_gain: 6.0e-5 # Limiter integrator gain, depower per N per s    [1/(N s)]
  depower_final_f_gain_stop: 1.0e-4 # Same during the soft-stop ramp: 0.35 -> 0.40 in 3 s [1/(N s)]
  depower_blend_time: 2.5      # Ramp of `rel_depower` to a new ladder target; 0 = step [s]
  reelout_softstart:  12.0     # Ramps the COMMANDED speed 0 -> v_set over this long  [s]
  reelout_softstop:   1.5      # Linear decel trigger at the far end               [s]
  reelout_delay:      4.2      # Wait after phase 3 before reel-out starts          [s]
  reelout_f_trigger:  6400.0   # Force that releases reel-out EARLY; Inf disables it [N]

  # --- entry state machine: park -> dive -> hold -> transition --------------
  chi_dive:          -135.0    # Dive course; >90 descends, <90 climbs, 90 flat    [deg]
  chi_hold:           -90.0    # Course commanded during the hold                 [deg]
  dive_el_margin:     17.0     # Margin above el_center where the dive ends       [deg]
  hold_time:          0.8      # Duration of the hold                               [s]
  fig8_d_gate:        4.0      # Cross-track error, transition -> fig8            [deg]

  # --- plant ----------------------------------------------------------------
  body_damping:       [0.0, 0.0, 40.0]  # Per axis; the turn_rate_coeffs key (settles to 0.8x)

  # --- pattern geometry; a SMALLER lemniscate is a TIGHTER one --------------
  f8_a:               20.0     # Width of the eight, azimuth spans ±A; sweep optimum [deg]
  f8_b:               11.0     # Height, elevation spans ±B/2; picked for margin 1.07 [deg]
  f8_c:               0.0      # Size of the right part                           [deg]
  f8_d:               0.0      # Asymmetry factor                                   [-]
  el_center:          18.0     # Centre elevation; lower turns easier, costs energy [deg]
  attractor_dist:      6.0     # Arc distance Q -> attractor; the FLOOR under a lead time [deg]
  attractor_lead_time: 0.8     # Lead as flight time, arc = t*v_app/L; 6° at 6 m/s, 8.5° at 10; 0 = off [s]
  attractor_dist_max:  0.0     # Ceiling on that arc; 0 = 2 x attractor_dist        [deg]
  reacquire_margin:    6.0     # Global best must beat the in-window best by this  [deg]
  up_loops:           false    # Up-loops instead of down-loops; down crosses the centre
  el_bias_gain:        0.5     # Per-lap learning gain for the elevation bias; 0 = off [-]
  el_bias_gain_final:  1.0     # Same, from state 5 on, where the sag deepens        [-]
  el_bias_max:         4.0     # Clamp on the learnt elevation correction, per band [deg]
  el_bias_bins:          5     # Azimuth bands the correction is learnt over; 1 = rigid [-]
  el_bias_smooth:     0.25     # How far each band is pulled to its neighbours per lap [-]
  el_bias_seed_laps:     2     # Remember the correction after this many laps; 0 = off [-]
  el_offset_final:     3.0     # Extra lift of the path once reel-out ends       [deg]
  el_offset_lead:      8.0     # How early the lift starts; gets it past the phase-5 gate [s]
  el_offset_wing:      1.5     # Extra lift at the LOBES, none in the centre       [deg]
  el_offset_wing_az:  10.0     # |azimuth| beyond which that lift is full   [deg or fraction of A]
  el_offset_wing_blend: 8.0    # Ramp width below it; NOT monotone, see the docstring  [same units]
  el_offset_wing_mode: "azimuth"  # azimuth (deg) | azimuth_frac (of the path's own A) | elevation
  el_offset_wing_depth: 0.0    # elevation mode: depth where it starts, in half-spans; 1 = the bottom [-]

  # --- heading/course PID ---------------------------------------------------
  heading_p:          0.1941   # Gain at v_app_ref; only their product is physical   [-]
  heading_i:          false    # Integral time [s], or false for no integral action
  heading_d:          0.12     # Derivative time [s]
  heading_d_n:        2.0      # Derivative filter, max gain of the D path          [-]
  ff_gain:            0.7      # Curvature feed-forward, u_ff = psi_dot_path/(c1 v_app); 0 = off [-]
  ff_lead_time:       0.45     # Read the path's course rate this far ahead of Q; ~the dead time [s]
  ff_smooth:          6.0      # Arc the tangent change is averaged over               [deg]
  ff_tau:             0.2      # Low-pass on u_ff and the chord correction; 0 = none    [s]
  ff_d_fade:          6.0      # Cross-track error at which the ff is fully off; fades from half [deg]
  ff_err_fade:        60.0     # Course error at which the ff is fully off; fades from half  [deg]
  v_app_ref:          27.0     # Speed flown in phase 3; anchors the gain schedule [m/s]
  v_app_min:          10.0     # Lower clamp on v_app, limits the gain boost      [m/s]
  entry_gain:         0.25     # Factor on heading_p during the entry phases        [-]
  entry_depower:      0.34     # Depower during the entry phases                    [-]

  # --- feedback signal: heading at low kite speed, course at high -----------
  v_kite_heading:     5.0      # At/below: pure heading feedback                  [m/s]
  v_kite_course:      10.0     # At/above: pure course feedback                   [m/s]
  fig8_pure_course:   false    # Course alone from phase 3 on; schedule governs entry
  max_steering:       0.32     # Command limit; raising it is CLOSED, see the log    [-]

  # --- entry descent limiter ------------------------------------------------
  entry_chi_max:      95.0     # Steepest course while off-path; 180 disables it   [deg]
  entry_d_gate:       12.0     # Cross-track error below which it is bypassed     [deg]
  entry_d_blend:      4.0      # Blend band above the gate, 0 = hard switch       [deg]
  entry_cut_margin:   30.0     # Distance from ±180° where chi_set's sign is noise [deg]

  # --- guards and metrics ---------------------------------------------------
  entry_f_min:        350.0    # Force floor of the entry guard, phases 0-2; not wc's f_low [N]
  first_lap_force_frac: 0.9375 # f_high x this in lap 1 AND for the startup solve: 7500 N, = f_high_awe_trim [-]
  v_app_abort:        55.0     # Stop the run above this apparent wind speed      [m/s]
  entry_time:         62.0     # Settle time after park_time before the metrics     [s]
  min_elevation:       6.5     # Floor criterion over the WHOLE run; also the reopt install gate [deg]
  min_span_frac:      0.7      # Pattern-SIZE criterion, fraction of f8_a / f8_b    [-]
