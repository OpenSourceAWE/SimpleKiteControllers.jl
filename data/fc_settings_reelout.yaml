# Settings of the flight controller flown by examples/simple_reelout.jl. A copy
# of fc_settings.yaml (used by simple_fig8.jl) with one change: `compliance: 0`,
# fixed at POSITION mode because REEL_OUT and V3Kite's own FORCE mode both drive
# the winch and only one can hold the drum at a time — simple_reelout.jl errors
# rather than silently picking one if this is left nonzero. Named by
# system_reelout_150m.yaml next to it; every key below is a field of
# `FC_Settings` (src/fc_settings.jl), where the full rationale for each value is
# documented. A missing key falls back to the struct default, an unknown key is
# an error.
#
# The PLANT is not here either: the system project (system_reelout_150m.yaml
# next to this file) and the simulation settings it names — including sim_time,
# the sample_freq whose inverse is the timestep, the wind speed (v_wind) and the
# initial tether length (l_tethers) — describe what is being flown, not how it
# is controlled.
#
# The POSITION-mode winch gains are NOT here — they live in wc_settings.yaml
# next to this file and are read straight from there; simple_reelout.jl uses
# them via V3Kite's own POSITION torque loop, driven by the REEL_OUT length
# setpoint. The winch_force_* keys below are FORCE-mode parameters, unused at
# compliance = 0; kept so this stays a complete FC_Settings, same as
# wc_settings.yaml keeps its unused force-mode keys. The REEL_OUT-specific keys
# (reelout_*) are what actually govern the winch here.
fc_settings:
  # --- simulation conditions ------------------------------------------------
  vsm_interval:       10       # Steps between VSM aero updates, 1 = tightest        [-]
  compliance:         0.0      # Fixed at POSITION mode; REEL_OUT needs the drum free [-]
  # 0.275 is a CEILING, not a tuned optimum. Depowering costs turn authority
  # (c1 0.2819 -> 0.2687 over 0.27 -> 0.28) and the optimizer's path is
  # curvature-limited, so 0.278 drops the startup margin to
  # min_feasibility_margin = 0.9 and simple_opt_reelout.jl refuses to fly.
  #
  # A longer starting length does NOT lift this, measured 2026-08-18: the
  # optimizer returns a TIGHTER path the further out it is anchored (path radius
  # 3.96 deg at 150 m, 3.37 deg at 180 m), which cancels the margin the extra
  # length buys. The ceiling is 0.278 at 150 m and 0.282 at 180 m. Only a fixed
  # shape escapes it - the 20/11 lemniscate simple_reelout.jl flies has radius
  # 4.73 deg at any length, so its ceiling is 0.315 at 150 m and 0.353 at 180 m.
  depower_setpoint:   0.275    # Depower held on the pattern                        [-]
  elevation:          73.0     # Settling elevation; no effect, see the cache key  [deg]
  park_time:          2.0      # Park: zero steering while the transients decay     [s]
  warmup_time:        2.0      # Discarded warm-up run, right after `init`          [s]

  # --- force-mode winch; unused here (compliance = 0), kept for a complete struct
  winch_force_tau:    10.0     # Compliance timescale; NOT scaled by compliance      [s]
  winch_len_kp:       100.0    # Length trim, length error -> reference force     [N/m]
  winch_damp:         500.0    # Drum damping; not optional, the drum free-wheels [N·s/m]
  winch_force_min:    100.0    # Floor on the reference force, keeps the tether taut [N]

  # --- REEL_OUT winch -----------------------------------------------------
  # kv/f_low/f_high/v_sat/t_startup and everything else WinchControllers.jl's
  # own WinchController tunes are in wc_settings.yaml now, not here —
  # that is WinchControllers.jl's OWN schema (its `WCSettings`), distinct from
  # this file's `FC_Settings` schema. The REEL_OUT keys below are this
  # package's OWN script-level logic in simple_reelout.jl (the l_set
  # trajectory and phase 5), not WinchControllers.jl fields. Reel-out stops on
  # TWO independent criteria, reelout_l_max and n_fig_eight — whichever fires
  # first.
  # 380 since 2026-08-18. NOTE for the optimized-path runs: AWETrim's own
  # DEFAULT_LIMITS["distance_radial"] is (100, 360) m and its pattern reels out
  # ~35 m within a lap, so a re-optimization request above ~325 m of anchor length
  # is infeasible by construction and comes back as a failed solve. Reaching
  # further out means more of the window is past that ceiling.
  reelout_l_max:      380.0    # Tether length at which reel-out stops              [m]
  # 0 since 2026-08-18: the optimized path flies faster laps than the lemniscate,
  # so a lap limit stopped the two runs at different tether lengths and made their
  # power and energy incomparable. Length is now the only criterion for both.
  n_fig_eight:        0        # Laps after which reel-out stops; 0 = length only [-]
  depower_final:      0.328    # Flown from phase 5 (final), once l_max is reached; tuned
                                # to hold ~3458 N, the reel-out mean force — see the log   [-]
  reelout_softstart:  12.0      # Ramps the COMMANDED speed 0 -> v_set over this long  [s]
  reelout_softstop:   0.0      # Linear decel trigger at the OTHER end; being tuned
                                # against the power undershoot — see the log        [s]
  reelout_delay:      4.0      # Wait after phase 3 before reel-out starts          [s]

  # --- entry state machine: park -> dive -> hold -> transition --------------
  chi_dive:           -95.0    # Dive course; >90 descends, <90 climbs, 90 flat    [deg]
  chi_hold:           -90.0    # Course commanded during the hold                 [deg]
  dive_el_margin:     15.0     # Margin above el_center where the dive ends       [deg]
  hold_time:          0.8      # Duration of the hold                               [s]
  fig8_d_gate:        5.0      # Cross-track error, transition -> fig8            [deg]

  # --- plant ----------------------------------------------------------------
  body_damping:       [0.0, 0.0, 40.0]  # Per axis; settling starts here and decays to
                                        # 0.8x it, so this is the turn_rate_coeffs key

  # --- pattern geometry; a SMALLER lemniscate is a TIGHTER one --------------
  # 20/11 comes from the shape sweep of 2026-08-15 (examples/optimize_fig8.jl, 30
  # shapes flown over f8_a 19..30 x f8_b 8..12; see Plan.md). It is +4.8 % of mean
  # reel-out power over the previous 30/12 — 8129 W against 7762 W — with the
  # winch's upper force controller never engaging and the steering command never
  # near its clamp.
  #
  # Width is the whole effect and 20 is a genuine interior optimum: 8101 W at 21,
  # 8130 at 20, 8126 at 19, and below 19 no height is flyable at all. Height is
  # NOT: at f8_a = 20 the three flown heights differ by 1 W, so 11 is chosen for
  # curvature MARGIN (1.07, against 1.03 at b = 10 and 1.05 at b = 12) rather than
  # for power. That margin is the reason to keep an eye on this pair — 1.07 is
  # thinner than the old 30/12's 1.22, so anything that lowers c1 (a depower or
  # body_damping change) eats into it faster than it used to.
  f8_a:               20.0     # Width of the eight, azimuth spans ±A             [deg]
  f8_b:               11.0     # Height of the eight, elevation spans ±B/2        [deg]
  f8_c:               0.0      # Size of the right part                           [deg]
  f8_d:               0.0      # Asymmetry factor                                   [-]
  el_center:          18.0     # Centre elevation; lower turns easier, costs energy [deg]
  attractor_dist:      8.0     # Arc distance Q -> attractor                      [deg]
  up_loops:           false    # Up-loops instead of down-loops; down crosses the centre
  el_bias_gain:        0.5     # Per-lap learning gain for the elevation bias; 0 = off [-]
  el_bias_gain_final:  1.0     # Same, from state 5 on, where the sag deepens        [-]
  el_bias_max:         4.0     # Clamp on the learnt elevation correction        [deg]
  el_offset_final:     1.5     # Extra lift of the path once reel-out ends       [deg]
  el_offset_lead:      0.0     # How long before the end the lift starts; 0 = at the end [s]

  # --- heading/course PID ---------------------------------------------------
  heading_p:          0.1941   # Gain at v_app_ref; only their product is physical   [-]
  heading_i:          false    # Integral time [s], or false for no integral action
  heading_d:          0.12     # Derivative time [s]
  heading_d_n:        2.0      # Derivative filter, max gain of the D path          [-]
  v_app_ref:          27.0     # Speed flown in phase 3; anchors the gain schedule [m/s]
  v_app_min:          10.0     # Lower clamp on v_app, limits the gain boost      [m/s]
  entry_gain:         0.25     # Factor on heading_p during the entry phases        [-]
  entry_depower:      0.34     # Depower during the entry phases                    [-]

  # --- feedback signal: heading at low kite speed, course at high -----------
  v_kite_heading:     5.0      # At/below: pure heading feedback                  [m/s]
  v_kite_course:      10.0     # At/above: pure course feedback                   [m/s]
  fig8_pure_course:   false    # Course alone from phase 3 on; schedule governs entry
  max_steering:       0.32     # Command limit; raising it is CLOSED, see the log    [-]

  # --- entry descent limiter ------------------------------------------------
  entry_chi_max:      95.0     # Steepest course while off-path; 180 disables it   [deg]
  entry_d_gate:       12.0     # Cross-track error below which it is bypassed     [deg]
  entry_d_blend:      4.0      # Blend band above the gate, 0 = hard switch       [deg]
  entry_cut_margin:   30.0     # Distance from ±180° where chi_set's sign is noise [deg]

  # --- guards and metrics ---------------------------------------------------
  v_app_abort:        45.0     # Stop the run above this apparent wind speed      [m/s]
  entry_time:         62.0     # Settle time after park_time before the metrics     [s]
  # 6.5 since 2026-08-18, down from 10: an externally optimized path descends lower
  # than the lemniscate does, because AWETrim constrains HEIGHT (>= 50 m) and not
  # elevation, and a fixed height is an ever smaller angle as the tether grows.
  # Also the gate simple_opt_reelout.jl applies to a re-optimized path BEFORE
  # installing it, so it bounds what is flown and not only what is scored — and the
  # kite flies BELOW its reference near the lobe tips (measured 3.0° of undershoot
  # on 2026-08-18: reference minimum 10.0°, flown 7.0°), so the gate is the more
  # permissive of the two uses.
  min_elevation:       6.5     # Floor criterion over the WHOLE run               [deg]
  min_span_frac:      0.7      # Pattern-SIZE criterion, fraction of f8_a / f8_b    [-]
