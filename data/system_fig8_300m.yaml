# System project of the figure-of-eight run, resolved by `project_file` to THIS
# package's data/ instead of the kite model's, so the run's conditions (wind,
# tether, winch, KCU, solver) can be varied here without editing V3Kite.
# `sim_settings` resolves relative to this file; `wc_settings` is a bare name
# resolved under the active data path, which the example points here too.
# `fc_settings` is read the same way, by this package's own `fc_settings`
# function (analogous to `KiteUtils.wc_settings`).
# `traj_opt_settings` is read the same way, by `traj_opt_settings_file`, and
# feeds `simple_opt_fig8.jl`'s `TrajOptSettings`. `turn_rate_coeffs` feeds
# `reload_turn_rate_table!`, also resolved through `turn_rate_coeffs_file`;
# `system_fig8_200m.yaml`, not this file, is the project `__init__` reads it
# against by default (`project_file()`'s own default).
# `kite_settings`/`structural_geometry`/`aero_geometry`/`vsm_settings`/
# `settle_settings`/`heading_settings` are V3Kite's own project keys, resolved
# against ITS data path (not this file's), so they name V3Kite's particle-model
# defaults (`system_psm.yaml`'s own values) unchanged.
system:
    sim_settings: "settings_fig8_300m.yaml"
    wc_settings: "wc_settings.yaml"
    fc_settings: "fc_settings.yaml"
    traj_opt_settings: "traj_opt.yaml"
    turn_rate_coeffs: "turn_rate_coeffs.yaml"
    kite_settings: "kite_settings_psm.yaml"
    structural_geometry: "struc_geometry.yaml"
    aero_geometry: "cfd_aero_geometry.yaml"
    vsm_settings: "vsm_settings.yaml"
    settle_settings: "settle_settings_default.yaml"
    heading_settings: "heading_settings_psm.yaml"
