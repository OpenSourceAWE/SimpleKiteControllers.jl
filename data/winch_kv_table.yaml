# Wind-dependent winch-law parameters, interpolated linearly between rows and
# CLAMPED outside the identified range rather than extrapolated. Read by
# `winch_kv(v_wind)` and `winch_f_low(v_wind)`; each overrides the flat value of
# the same name in data/wc_settings.yaml. Add a row and re-identify the curve
# here, not a new key elsewhere, when another wind speed is tuned.
#
# kv     — `v_set = kv * sqrt(force)`. Flat at 0.0408 from 3 to 9 m/s; the
#          10 m/s row is 0.039, identified 2026-08-27 (sweep below). 11 and
#          12 m/s carry 0.0408 UNTESTED at the current tether and winch
#          controller: the 2026-08-26 notes that used to live here (0.0558 at
#          10, 0.0738 shipped at 11, 12 m/s out of envelope) described a
#          DIFFERENT tether and winch controller and no longer apply to this
#          table. Their text remains in git history; see also the 2026-08-27
#          entry in docs/fig8_tuning_log.md.
#
#          Lower kv reels out slower, the kite keeps more of the wind, and
#          force and power both rise — until the plant's 8400 N rating is
#          reached. Sweep at 10 m/s (150 -> 380 m, no turbulence; phase-4
#          peak force against the 8400 N limit):
#
#            kv      mean F   peak F   power    ratio   verdict
#            0.0408   6332 N   7294 N  20051 W   0.85   all 10 passed
#            0.039    6690 N   7901 N  21161 W   0.84   all 10 passed
#            0.0385   6759 N   8411 N  21247 W   0.85   FAILED max force
#            0.036    7223 N   9371 N  22543 W   0.85   FAILED max force
#
#          0.039 shipped: +5.5 % power for a phase-4 peak 499 N under the
#          limit. It is the knee: below it the gain collapses while the peak
#          keeps climbing (0.0385 bought 86 W and crossed the limit by 11 N)
#          because the soft law starts clamping against f_high 8000 N — mean
#          force 6690 N, peaks 7901 N. Force is far more kv-sensitive here
#          than the retired 11 m/s sweep suggested. power_ratio stays at
#          0.84-0.85 throughout: predicted and measured power scale together
#          with kv, so kv moves the power LEVEL, not the plant-model gap.
#
# f_low  — force floor [N] below which the LowerForceController reels in. It has
#          to move with the wind because the winch's rating does not and the
#          kite's force does (with the square of the wind speed), so one value
#          cannot serve both ends: 350 N was sized for a 4000 N winch and is too
#          low for this one from 4 m/s up, while 700 N takes over the run at
#          3 m/s. Measured 2026-08-25 at 150 m:
#
#            v_wind  f_low  limiter share  max d    power   verdict
#              3.0    350       20.6 %     5.54°    559 W   all 9 passed
#              3.0    700       63.2 %     8.02°    675 W   FAILED max d
#              4.0    700        1.1 %      —      2043 W   all 9 passed
#
#          The 3 m/s row is therefore 350 and everything from 4 m/s up is 700.
#          NOT the entry guard's floor: that is `FC_Settings.entry_f_min`, which
#          is bounded by what a DEPOWERED wing can pull and does not scale here.
#
# force_limit — `WCSettings.force_limit`, read by `winch_force_limit(v_wind)`.
#          NOT interpolated: it is a step, the value of the last row at or below
#          the wind speed. `data/wc_settings.yaml` now defaults to "soft" too
#          (2026-08-28), since every row in this table is "soft".
#
#          "soft" makes the reel-out law itself the upper force limiter, by
#          inverting the optimizer's own saturating tension curve. Its
#          effective floor is sp(beta*f_low)/beta, which used to sit above the
#          whole 3 m/s force range (587 +- 165 N) at the AWETrim-shared
#          beta 1e-3 (floor 693 N there), ruling out "soft" below ~6 m/s.
#          `WCSettings.softminus_beta` is now sharpened locally to 0.03 (see
#          `data/wc_settings.yaml`) and never sent to AWETrim — the server
#          still gets a fixed 1e-3 (`AWETRIM_SOFTMINUS_BETA`,
#          `examples/awetrim_client.jl`), since 2e-3/5e-3 make its 3 m/s solve
#          fail (422). At beta 0.03 the local floor drops to ln2/beta ~ 23 N,
#          well below the force range at both 3 and 4 m/s, so both rows are
#          "soft" now too — untested by measurement at 4 m/s, extrapolated from
#          the same floor math that is measured safe at 3.
#
#            - Measured at 6 m/s: a NO-OP (3451 +- 436 N vs 3423 +- 414 hard,
#              power within 0.3 %), so it is safe from there up.
#            - Measured at 9 m/s: the win it exists for — 0 % of the steady window
#              over the plant's 8400 N rating against 73.7 %, at 1.7 % power.
#
#          5 m/s is untested and takes the 4 m/s row's "soft" by the step rule.
entries:
  - v_wind: 3.0
    kv: 0.0408
    f_low: 350.0
    force_limit: "soft"
  - v_wind: 4.0
    kv: 0.0408
    f_low: 700.0
    force_limit: "soft"
  # Neutral for kv and f_low (both already flat from 4 to 9); force_limit is
  # "soft" throughout the table now, so this row no longer marks a step.
  - v_wind: 6.0
    kv: 0.0408
    f_low: 700.0
    force_limit: "soft"
  - v_wind: 9.0
    kv: 0.0408
    f_low: 700.0
    force_limit: "soft"
  - v_wind: 10.0
    kv: 0.039
    f_low: 700.0
    force_limit: "soft"
  - v_wind: 11.0
    kv: 0.0408
    f_low: 700.0
    force_limit: "soft"
  - v_wind: 12.0
    kv: 0.0408
    f_low: 700.0
    force_limit: "soft"
