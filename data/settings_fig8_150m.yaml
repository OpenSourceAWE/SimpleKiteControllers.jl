# Simulation settings of the figure-of-eight run, named by system_fig8_150m.yaml
# next to it and loaded into a KiteUtils `Settings` by the kite model. Started as
# a copy of V3Kite's data/settings_reelout.yaml and is read INSTEAD of it, so the
# plant a run is flown against — wind, tether, KCU, winch, solver — can be varied
# without editing the model.
#
# The length of a run and its timestep live HERE: `sim_time` and `sample_freq`
# below are what `init` falls back to, and the loop then takes both from the
# model. `sample_freq` is not a tuning knob — `step!` holds the VSM aero load
# frozen inside the DAE between updates, and below ~60 Hz that explicit coupling
# develops a growing 2*dt oscillation at maximum dynamic pressure.
#
# What is NOT here: the controller's own tuning is fc_settings.yaml, the
# POSITION-mode winch gains are wc_settings.yaml, and the geometry,
# polars and VSM settings are loaded by V3Kite from its own data directory and
# never pass through this file. The wind speed `v_wind` and the initial tether
# length (`l_tethers`) below are read from HERE alone — fc_settings.yaml has
# neither field; the example passes both to `init` from this file.
system:
  log_file: 'fig8_150m' # filename without extension; use / as path delimiter, even on Windows
  time_lapse: 1.0 # relative replay speed
  sim_time: 100.0 # simulation time; ~43 s per lap plus the descent  [sim only]
  sample_freq: 90 # sample frequency in Hz; its inverse is the run's timestep
  fixed_font: '' # name or filepath+filename of alternative fixed pitch font
  g_earth: 9.81

initial:
  l_tethers: [150.0] # initial tether length       [m]
  v_reel_outs: [0]   # initial reel out speed    [m/s]
  elevations: [73]   # initial elevation angle   [deg]

solver:
  solver: 'FBDF'
  abs_tol: 0.01  # absolute tolerance of the DAE solver [m, m/s]
  rel_tol: 0.002 # relative tolerance of the DAE solver [-]

kite:
  model: ''            # 3D model of the kite
  foil_file: ''        # filename for the foil shape
  physical_model: 'v3' # name of the kite model to use (KPS3, KPS4 or SymbolicAWEModel)
  mass: 6.2            # kite mass [kg]
  quasi_static: false  # whether to use quasi static kite points or not
  alpha_zero: 8.8      # should be 5 [degrees]

kcu:
  # KCU actuator tape rate limits fed to the KCU model. Without finite values
  # the actuator would freeze (defaults of 0). All other KCU fields fall back
  # to the KiteUtils defaults.
  v_depower:  0.075 # depower-tape rate limit      [1/s]
  v_steering: 0.2   # steering-tape rate limit     [1/s]
  kcu_mass: 8.4     # mass of the kite control unit [kg]

tether:
  # Bosch et al. 2014 used k = AE/L = 4.52E3 N/m for the bridles of the V3
  # Bosch et al. 2014 used C = 251.7 Ns/m for bridles of the V3
  d_tether: 4.0      # tether diameter [mm]
  cd_tether: 1.1     # was: 0.958; drag coefficient of the tether
  damping: 473.0     # unit damping coefficient        [Ns]
  c_spring: 614600.0 # unit spring constant coefficient [N]
  rho_tether: 724.0  # density of Dyneema           [kg/m³]
  e_tether:
    55000000000.0 # axial tensile modulus of Dyneema (M.B. Ruppert) [Pa]
    # SK75: 109 to 132 GPa according to datasheet

winch:
  winch_model: 'TorqueControlledMachine' # or AsynchMachine
  max_force: 8400 # maximal (nominal) tether force; short overload allowed [N].
                  # AWETrim LEI-V3 system.yaml rates BOTH the tether and the
                  # electric_winch drum at 8400 N; this matches that.
  v_ro_max: 4.0          # maximal reel-out speed                        [m/s]
  v_ro_min: -8.0         # minimal reel-out speed (=max reel-in speed)   [m/s]
  drum_radius: 0.1615    # radius of the drum                              [m]
  max_acc: 4.0           # maximal acceleration of the winch            [m/s²]
  gear_ratio: 6.2        # gear ratio of the winch                         [-]
  inertia_total: 0.204 # total inertia, as seen from the motor/generator [kgm²]
  f_coulomb: 122.0       # coulomb friction                                [N]
  c_vf: 30.6             # coefficient for the viscous friction         [Ns/m]
  p_speed: 1.0           # proportional gain of the winch speed controller [-]
  i_speed: 0.1           # integral gain of the winch speed controller     [-]

environment:
  v_wind: 5.0        # wind speed at reference height         [m/s]
  upwind_dir: -90.0  # upwind direction                       [deg]
  wind_vec: [5.0, 0.0, 0.0] # wind vector at ref height (ENU) [m/s]
  use_wind_vec: true # use wind_vec instead of v_wind/upwind_dir
  temp_ref: 15.0     # temperature at reference height         [°C]
  height_gnd: 0.0    # height of groundstation above see level  [m]
  h_ref: 6.0         # reference height for the wind speed      [m]

  rho_0: 1.225    # air density at zero height and 15 °C    [kg/m³]
  alpha: 0.08163  # exponent of the wind profile law
  z0: 0.0002      # surface roughness                           [m]
  profile_law: 3  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG
  # the following parameters are for calculating the turbulent wind field using the Mann model
  use_turbulence: 0.2 # turbulence intensity relative to Cabau, NL
  v_wind_gnds: [3.483, 5.324, 8.163] # wind speeds at ref height for calculating the turbulent wind field [m/s]
  avg_height: 200.0   # average height during reel out          [m]
  rel_turbs: [0.342, 0.465, 0.583] # relative turbulence at the v_wind_gnds
  i_ref: 0.14 # is the expected value of the turbulence intensity at 15 m/s.
  v_ref:
    42.9 # five times the average wind speed in m/s at hub height over the full year    [m/s]
    # Cabauw: 8.5863 m/s * 5.0 = 42.9 m/s
  grid: [100, 4050, 500, 70] # grid size nx, ny, nz and minimal height z_min              [m]
  height_step: 2.0 # use a grid with 2m resolution in z direction                         [m]
  grid_step: 2.0 # grid resolution in x and y direction                                   [m]
